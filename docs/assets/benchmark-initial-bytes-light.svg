<title id="title">Historical initial-output bytes: native vs Fusion</title><desc id="desc">Historical initial-output bytes only, not total interaction bytes, expanded bytes or tokens. Measurements: 3 October 2026, local build fc942197, Windows 11 and Node 24.12.0. All eleven cases are included using native and Fusion first-run stdout plus stderr bytes. Five small-output cases increase. Six receipt responses are smaller initially but may omit required content; expansions add bytes and time. Each panel has a different explicit linear scale. Typecheck passes: native 60, Fusion 87 bytes; TypeScript: 3 errors: native 287, Fusion 313 bytes; Setup tests: 7 pass: native 700, Fusion 728 bytes; Node version: native 10, Fusion 36 bytes; Empty Git status: native 0, Fusion 26 bytes; TypeScript: 60 errors: native 4,995, Fusion 711 bytes; Node tests: 1 / 61 fails: native 2,611, Fusion 459 bytes; Git log: 50 commits: native 8,996, Fusion 205 bytes; Git diff: summary: native 2,190, Fusion 205 bytes; 200-line noise fixture: native 4,341, Fusion 321 bytes; Git log: 20 patches: native 1,277,810, Fusion 259 bytes. The patch retained 1,277,798 redacted bytes. These observations do not establish current-code, npm-package, host-token, cost, speed or task-quality gains.</desc>
