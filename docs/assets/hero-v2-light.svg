<title id="title">Fusion Jev: compact results, retained evidence</title><desc id="desc">Fusion Jev. Compact command results; inspect retained evidence when more detail is needed. Local CLI and MCP tools for Claude Code and Codex. Core tools need no API key; Jev selection is optional. Receipts are short-lived and capture and redaction limits apply.</desc>
