name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run demo
      - run: npm run benchmark
      - run: npm run benchmark:workspace
      - run: npm run benchmark:support -- --corpus=noisy
      - run: npm run benchmark:workflows
      - run: npm pack --dry-run
      - run: npm run pack:smoke
